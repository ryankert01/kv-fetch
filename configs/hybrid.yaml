inherit: reasoning.yaml

# Hybrid models (EXPERIMENTS.md, "Hybrid models", agreed 2026-10-26). Run with .venv-hybrid
# (transformers 5.19, fla-core 0.5.2); E3's .venv stays as it was.

models:
  local_files_only: true

hybrid:
  models:
    qwen35_4b:
      name: Qwen/Qwen3.5-4B
      layers: [3, 7, 11, 15, 19, 23, 27, 31]   # every full-attention layer (layer_types)
      sampling: {temperature: 1.0, top_p: 0.95, top_k: 20, presence_penalty: 1.5}   # model card, thinking mode
    qwen3_4b:
      name: Qwen/Qwen3-4B
      layers: [3, 8, 12, 17, 21, 26, 30, 35]   # floor((L + 1) * 36 / 32) - 1: Qwen3.5's attention depths
      sampling: {temperature: 0.6, top_p: 0.95, top_k: 20, presence_penalty: 0.0}   # = e3.sampling

  # H1 (scripts/h1_screen.py): offline screen, exact attention from one replay forward per sequence
  h1:
    sequences:                       # sample 0 of each explore problem, full attention
      qwen35_4b: results/hybrid/h3_shards/qwen35_4b/full     # H3's full-attention run (token ids stored)
      qwen3_4b: results/reasoning/e3_shards/full              # E3's full run (text: re-tokenized)
    sample: 0
    max_gen_tokens: 16384            # first 16K generated tokens (E3's cap) for both models
    budgets_tokens: [256, 512, 1024] # attended tokens per layer incl. sink + recent (as E3)
    step_chunk: 128                  # decode steps per GPU batch of exact attention
    lookahead_layers: [1, 2, 3]      # H-c: query predicted from the hidden state entering layer L - k
    ours: {mean_mix: 0.5}            # E3's gain: Quest bound + mean-key logit, summed over KV heads
    gdn_prior_weights: [0.1, 0.25, 0.5]   # H-d mixing weights (chosen on aime24, reported on aime25)
    fidelity:                        # H-b offline: teacher-forced sparse forward, next-token KL vs dense
      n_sequences: 10
      max_gen_tokens: 8192
      query_chunk: 1024
    shard_dir: results/hybrid/h1_shards
    gate:
      budget_tokens: 512             # (i) oracle(qwen35) <= oracle(qwen3); (ii) quest gap share(qwen35) >= qwen3's
      lookahead_max_points: 1.0      # H-c: lookahead-3 query costs <= 1.0 point of missing attention
      gdn_prior_min_reduction: 0.05  # H-d

  # H2: cheap page summaries
  h2:
    metadata_max_share: 0.02         # GPU metadata <= 2% of KV bytes
    within_points: 0.5               # missing attention within 0.5 points of full-precision ours at 512
    engine_specs:                    # H2 candidate -> the engine method behind "ours" in H3 (sparse_decode.py)
      mean16: {method: ours, bound_fmt: none, mean_fmt: fp16}
      mean8: {method: ours, bound_fmt: none, mean_fmt: fp8}
      meanc: {method: ours, bound_fmt: none, mean_fmt: chan}
      quest4: {method: quest, bound_fmt: int4}
      quest4p2: {method: quest, bound_fmt: int4p2}
      lite: {method: ours, bound_fmt: int4p2, mean_fmt: chan}
    # 2026-10-26, results/h1_explore.json h2_choice (Qwen3.5 screen complete, 30 sequences): mean8 is the
    # cheapest format within 0.5 points of ours|sum on aime24 (24.48% vs 25.17% missing at 512; 1.56% of KV)
    chosen: mean8

  # H3 (scripts/run_h3.py): online accuracy
  h3:
    tasks: [aime24, aime25]
    split: explore
    samples: 8
    sample_group: 4
    seed: 20261026
    max_new_tokens:
      qwen35_4b: 32768               # model card: 32K for most queries (81,920 for competitions: too costly)
      qwen3_4b: 16384                # = E3
    batch_size: {qwen35_4b: 24, qwen3_4b: 12}   # qwen35: ~38 GB at 32K (dry run: 16 slots 28 GB)
    runs:                            # priority tiers per model (method@attended budget); "ours" waits for H2
      qwen35_4b:                     # 2026-10-26: ours moved ahead of the 1024 baselines once H2 picked (scheduling only)
        - [full, quest@512, snapkv@512, oracle@512]
        - [ours@512, ours@1024]
        - [quest@1024, snapkv@1024, oracle@1024]
      qwen3_4b:                      # H-b: prompt-protected eviction under E3's settings, with its own full run
        - [full, snapkv@1024, snapkv@512]
    snapkv_window: 32
    snapkv_protect_prompt: true      # prompt pages are evicted only when the prompt alone exceeds the budget
    out_dir: results/hybrid/h3_shards
    claims_dir: results/hybrid/h3_claims
    gate:
      budget_tokens: 512
      baselines: [quest, snapkv]
      margin_points: 5
    hb_gate:                         # H-b online: loss of snapkv@1024 vs full, qwen35 <= half of qwen3's
      budget_tokens: 1024
      max_loss_ratio: 0.5

  # H4 (scripts/h4_costs.py): measured inputs of the tiered-KV cost model
  h4:
    batches: [1, 8, 32, 64, 128, 160]   # layer times up to the tiered capacity at 32K (one attention layer's KV)
    contexts: [8192, 16384, 32768]
    budget_tokens: 512               # H3's gate budget
    kv_bytes_per_token: 32768        # Qwen3.5-4B: 8 layers x 4 KV heads x 256 x (K, V) x 2 B
    max_kv_gib: 30                   # whole-step calibration only where all layers' KV fits on the GPU
    iters: 50
    page_bytes: 65536                # one 16-token page of one attention layer (all KV heads, K and V)
    host_pool_mib: 2048
    copy_mib: [1, 4, 16, 64]
    fetch_pages: [1, 4, 16, 64, 256, 1024, 4096]   # scattered pages per fetch (64 KB to 256 MB)
    gather_block: 1024               # int64 elements per Triton program in the zero-copy gather
    zero_copy_programs: 16           # the looping gather's programs (enough loads in flight for PCIe, few SMs)
    overlap_batches: [8, 32, 160]
    lookahead_multiples: [1, 2]      # H-c prefetch of k x budget pages
    cpu_threads: 8
    gate: {min_ratio: 0.9}           # stretch: tiered >= 0.9x all-on-GPU where both fit; larger max batch at 32K
    residency:                       # scripts/h4_residency.py: pages a host-resident KV moves per step
      model: qwen35_4b
      sequences: results/hybrid/h3_shards/qwen35_4b/full   # sample h1.sample, the model's own length
      every: 3                       # every 3rd explore problem: 10 sequences
      cross_check:                   # H4 audit: the selector's own trajectories (sample h1.sample of ours@512)
        sequences: results/hybrid/h3_shards/qwen35_4b/ours_512
        every: 10                    # 3 sequences
      max_gen_tokens: 32768
      cache_multiples: [1, 2, 4]     # GPU page cache, x the largest per-step budget (LRU)
      prefetch: {lookahead: 3, cache_plus: [[2, 1], [4, 2]]}   # [cache x budget, prefetch x budget] with the H-c query
      lag1_cache_multiples: [1, 2]
      step_chunk: 512
      q_self_err_max: 1.0e-2         # as scripts/h1_screen.py
      shard_dir: results/hybrid/h4_shards
      mc_samples: 400                # sampled batches per (batch, context bucket)
      mc_seed: 20261026
      gpu_mem_gib: 48                # RTX 6000 Ada / RTX A6000 (49140 MiB)
      reserve_gib: 4                 # activations and workspace (per-slot logits and penalty masks counted apart)
      host_kv_gib: 160               # of 251 GiB host memory on gpuserv4
