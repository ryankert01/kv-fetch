inherit: tasks.yaml

# Spec §5 small eval: must finish in <= 1 hour on one GPU. Shrink quantity, never phenomena.
small_eval:
  # Provisional until the model gate picks the iteration model (§9.4). Override with
  # --set small_eval.model=... --set small_eval.context_length=...
  model: meta-llama/Llama-3.2-3B-Instruct
  context_length: 32768
  decode_steps: 256
  samples_per_task: 20
  seed: 0
  tasks:
    - name: ruler_multikey        # sudden-jump task
      kind: ruler
      ruler_task: niah_multikey_1
      # the answer ends after ~10 tokens; later steps are a forced continuation
      # (stop tokens masked). natural_stop_step is recorded in every trace.
      suppress_stop: true
    - name: longgen               # gradual task (placeholder for the custom multi-turn task, §9.2)
      kind: longgen
      suppress_stop: true
  layers:
    mode: auto                    # early / mid / late fractions + strongest retrieval layer
    fracs: [0.1, 0.5, 0.9]
    probe:                        # retrieval-head probe: attention mass on the queried needle
      ruler_task: niah_single_2
      samples: 4
      steps: 8                    # first decode steps = emitting the answer value
      seed: 1
  analysis:
    budget_frac: 0.05             # recall@5%
    k: [1, 4]
    predictors: [last_step, ema]  # naive reference baselines only (not Phase 2)
    topk_coverage_K: [128, 256, 512, 1024]
  max_wall_s: 3600
  trace_dir: traces/small_eval
  out_dir: results/small_eval
