note: 'RL rollouts, kill test R1 (18:04, user: "we should do the experiment"). Is there headroom for a hybrid-aware
  memory policy in a synchronous GRPO rollout step once vLLM''s own knobs are tuned? Record real lengths (64 MATH
  level 3-5 problems x 8 samples, T = 1, 16K cap) for Qwen3.5-4B (hybrid) and Qwen3-4B (dense), then replay each
  trace under 0.5 / 0.7 of the GPU and watermark 0 / 0.05 / 0.1 / 0.2, scheduler instrumented; rollout_bound.py
  compares each makespan with a no-preemption bound. Kill if the best setting is within 15% of the bound.
  Traces on any free card (lengths do not depend on it); replays on the Ada cards only.'
jobs:
- {id: r1_trace_qwen35_4b, kind: cmd, priority: 1, timeout_s: 7200, why: 'GRPO rollout trace, qwen35_4b',
   cmd: '{py} scripts/rl/rollout_trace.py configs/rl_rollout.yaml {out} --model qwen35_4b'}
