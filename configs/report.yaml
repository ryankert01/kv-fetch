inherit: small_eval.yaml

# scripts/make_report.py: renders report.html from the committed results/*.json.
report:
  out: report.html
  gate_config: model_gate.yaml           # relative to this file; supplies tasks, threshold, out_dir
  small_eval_runs:                       # results/small_eval/<tag>.json
    - meta-llama__Llama-3.2-3B-Instruct__32768
    - Qwen__Qwen3-4B__32768
  fidelity:                              # model -> results file
    meta-llama/Llama-3.2-3B-Instruct: results/topk_fidelity.json
    Qwen/Qwen3-4B: results/topk_fidelity_qwen3_4b.json
  needle_timing: results/needle_timing.json
  needle_x_max: 60                       # decode steps shown in the needle-timing chart
  free_disk_path: /home                  # reference line on the trace-size chart
  trace_size_rows:                       # (scenario, head_kind) at page 16
    - [small_eval, query, "Small eval (4 layers, 40 prompts)"]
    - [large_32k, kv, "Large eval, 32K (all layers, 400)"]
    - [large_128k, kv, "Large eval, 128K (all layers, 400)"]
    - [large_128k, query, "Same, per query head (4× heads)"]
  # Assumptions for the lead-time arithmetic (spec §1 constraint:
  # bytes moved per step <= PCIe bandwidth x step time).
  hardware:
    model: meta-llama/Llama-3.1-8B-Instruct
    context: 131072
    pcie_gb_per_s: 24                    # practical PCIe 4.0 x16 host->device
    step_ms: 20                          # batch-1 8B decode step, weight-bandwidth bound
    budget_frac: 0.05
  recommendation:
    iteration: Qwen/Qwen3-4B
    iteration_length: 32768
    reference: Qwen/Qwen3-8B
