inherit: sweep.yaml

# Long reasoning traces for the "can we win?" comparison against eviction (H2O, SnapKV, RaaS,
# LazyEviction, R-KV, ForesightKV upper bound), keep-all (Quest) and lookahead-offload
# (OasisKV upper bound) methods. Qwen3-4B thinking mode: ForesightKV reports Qwen3-4B on AIME.

trace:
  head_reduce: kv_mean           # store per-KV-group mass (1/4 the size); queries stay per head

sweep:
  max_context: 17408             # prompt room = max_context - max_new_tokens (AIME25 prompts reach 853 tokens)
  max_new_tokens: 16384
  context_margin: 256
  shard_size: 2                  # long samples: finer jobs balance the GPUs better
  trace_dir: /share3/saves/ryankert_l/kvfetch/traces/reasoning
  records_dir: results/reasoning/records
  claims_dir: results/reasoning/claims
  tasks:
    _replace: true             # only these tasks, not the sweep's six
    aime24:
      loader: aime
      name: aime24
      dataset: HuggingFaceH4___aime_2024/**/*.arrow
      instruction: "\nPlease reason step by step, and put your final answer within \\boxed{}."
      n: 30
    aime25:
      loader: aime
      name: aime25
      dataset: math-ai___aime25/**/*.arrow
      instruction: "\nPlease reason step by step, and put your final answer within \\boxed{}."
      n: 30
    math500:
      level: 5
      instruction: "\nPlease reason step by step, and put your final answer within \\boxed{}."
      n: 16

# scripts/compare_methods.py: every method replayed on the same traces at equal GPU budget.
compare:
  budgets_tokens: [512, 1024, 2048, 4096]   # total resident KV per KV head incl. sink + recent window
  evict_methods: [streaming, h2o, tova, snapkv, raas, lazy, rkv, oracle]
  prefetch_methods: [on_demand, stale_q, q_trend, oasis_ub]
  lookahead_steps: [1, 4]        # prefetch decided L steps early (transfer latency, in decode steps)
  gpu_capacity_mult: 2.0         # GPU working set = Tier 1 (attended budget) + Tier 2 standby
  snapkv_window: 32
  important_mult: 1.0            # "important" = attention above the uniform share (RaaS, LazyEviction)
  rkv_lambda: 0.5                # R-KV: weight of importance vs (1 - lambda) redundancy
  q_slope_steps: 4               # ours: query slope from q[t] - q[t-4]
  blas_threads: 4                # per analysis worker

# scripts/compare_selectors.py (EXPERIMENTS.md, E1): training-free selectors for tiered KV. Candidates
# read only the current query (Quest bound) and attention they observed; upper bounds read the truth.
selectors:
  budgets_tokens: [512, 1024, 2048]
  candidates:                        # see kvfetch/selectors.py for the spec keys
    quest:             {quest_share: 1.0}
    quest_recent12:    {quest_share: 1.0, recent_share: 0.125}
    quest_recent25:    {quest_share: 1.0, recent_share: 0.25}
    hist_last:         {quest_share: 0.0, history: last}
    hist_peak:         {quest_share: 0.0, history: peak}
    hyb_last_q75:      {quest_share: 0.75, history: last}
    hyb_last_q50:      {quest_share: 0.5, history: last}
    hyb_last_q25:      {quest_share: 0.25, history: last}
    hyb_peak_q75:      {quest_share: 0.75, history: peak}
    hyb_peak_q50:      {quest_share: 0.5, history: peak}
    hyb_peak_q25:      {quest_share: 0.25, history: peak}
    shared_quest:      {quest_share: 1.0, shared: true}
    fused_sum_w25:     {fuse: sum, history_weight: 0.25, history: last}
    fused_sum_w50:     {fuse: sum, history_weight: 0.5, history: last}
    fused_max:         {fuse: max, history: last}
    quest_mean50:      {quest_share: 1.0, mean_mix: 0.5}
    hyb_last_q75_mean50: {quest_share: 0.75, history: last, mean_mix: 0.5}
    fused_sum_w25_mean50: {fuse: sum, history_weight: 0.25, history: last, mean_mix: 0.5}
  upper_bounds: [true_topB, shared_topB]
  summary_bytes: 2                   # fp16 key min/max per page on GPU (Quest)
  history_bytes: 4                   # one fp32 observed-attention score per page
  gate:                              # E1 gate: close >= half of Quest's gap to true top-B at <= 1.5x its cost
    budget_tokens: 1024
    gap_closed_min: 0.5
    cost_ratio_max: 1.5
  blas_threads: 4

# scripts/dump_keys.py (EXPERIMENTS.md, E2): full keys for emulating published selectors offline.
e2:
  keys_dir: /share3/saves/ryankert_l/kvfetch/keys/reasoning
  check_steps: 3                     # steps per trace whose mass is recomputed from q and the keys
  check_atol: 0.05                   # max abs page-mass gap: ~2e-4 replayed on the GPU model that traced,
                                     # ~1e-2 across models (A6000 vs 6000 Ada); a misaligned step gives > 0.07
  budgets_tokens: [512, 1024, 2048]
  step_chunk: 128                    # steps per GPU batch of exact attention
  shard_dir: results/reasoning/e2_shards
  shadowkv: {chunk: 8, outlier_share: 0.05}   # landmark chunk size; budget share kept for outlier chunks
  infinigen: {partial_ratio: 0.25}   # share of key channels used to speculate attention
  lessismore: {recent_share: 0.25}   # budget share for the recency window
  ours: [quest, hyb_last_q75, fused_sum_w25]  # selectors.candidates rerun on the exact attention
